name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Пайплайн (парсер, БД, алерты, отчёт)
        run: python selftest.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Интерфейс витрины
        run: |
          # uitest.js проверяет реальную выдачу (рейсы, календарь, форму
          # поиска), поэтому сперва наполняем БД демо-данными из фикстуры —
          # без этого DATA на странице пустой и большинство проверок ложно
          # не находят, что тестировать.
          python collector.py --site
          python webapp.py --out /tmp/index.html
          python colorcheck.py /tmp/index.html
          npm install --no-save jsdom
          node uitest.js /tmp/index.html

      - name: Макет /design/ на реальных данных
        run: |
          # colorcheck.py заточен под палитру webapp.py и не знает токены
          # дизайна из design/ (там своя, отдельно проверенная схема) —
          # здесь только убеждаемся, что сборка на реальных данных не падает.
          python design_app.py --out /tmp/design-index.html
          test -s /tmp/design-index.html
