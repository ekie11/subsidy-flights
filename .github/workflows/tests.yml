name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Пайплайн (парсер, БД, алерты, отчёт)
        run: python selftest.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Интерфейс витрины
        run: |
          python webapp.py --out /tmp/index.html
          python colorcheck.py /tmp/index.html
          npm install --no-save jsdom
          node uitest.js /tmp/index.html
