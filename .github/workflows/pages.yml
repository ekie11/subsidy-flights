name: Публикация витрины на GitHub Pages

# Сборщик и витрина живут в одном воркфлоу: Actions умеет ходить в интернет,
# поэтому отдельный VPS для MVP не нужен. Как только понадобится
# гарантированное расписание — переносить на VPS.

on:
  push:
    branches: [main]
  schedule:
    # Раз в час: лимит партнёра — 1000 запросов на одну продажу за месяц,
    # а проход — это маршруты × даты × категории (сейчас 120 запросов,
    # ~86 тыс. в месяц). Минута 17, а не 0: на ровный час у Actions пик
    # нагрузки, запуски задерживаются и пропускаются. Расписание всё равно
    # не гарантированное — для боевого мониторинга нужен VPS.
    - cron: "17 * * * *"
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные запуски отменяем: две сборки, пишущие одну страницу, не нужны.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Альтернативные редакции /design/ живут в отдельных ветках и
      # публикуются рядом с основной: /dark/, /minimal/, /brutal/, /soft/,
      # /gpt/, /image/. Если
      # какой-то ветки нет, основной сайт всё равно собирается, просто без
      # этого адреса.
      - name: Взять тёмную редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-night-reference
          path: variants/dark

      - name: Взять минималистичную редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-minimal
          path: variants/minimal

      - name: Взять бруталистскую редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-brutalist
          path: variants/brutal

      - name: Взять мягкую редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-soft
          path: variants/soft

      - name: Взять кинематографичную редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-gpt
          path: variants/gpt

      - name: Взять аэропортовую редакцию
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: claude/design-image
          path: variants/image

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # История наличия мест нужна для алертов «места появились / кончились»:
      # без неё каждый запуск считает, что видит рейсы впервые. Раннер
      # одноразовый, поэтому БД переносим кэшем между запусками.
      - name: Восстановить базу наблюдений
        uses: actions/cache/restore@v4
        with:
          path: data
          key: subsidy-db-${{ github.run_id }}
          restore-keys: |
            subsidy-db-

      - name: Собрать данные и витрину
        env:
          BILETDV_PARTNER_ID: ${{ secrets.BILETDV_PARTNER_ID }}
          BILETDV_API_URL: ${{ secrets.BILETDV_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Адрес воркера поиска по запросу (worker/). Не секрет — это
          # переменная: Settings → Secrets and variables → Actions → Variables.
          SUBSIDY_SEARCH_API: ${{ vars.SUBSIDY_SEARCH_API }}
        run: |
          set -e
          # Живой режим включаем только когда есть боевой PartnerID.
          # Иначе собираем демо на фикстуре — страница выйдет с баннером
          # «демо» и мета-тегом noindex, никого не введя в заблуждение.
          if [ -n "$BILETDV_PARTNER_ID" ] && [ "$BILETDV_PARTNER_ID" != "KirillTest" ]; then
            echo "режим: LIVE"
            python collector.py --live --site --report
          else
            echo "режим: DEMO (боевой PartnerID не задан в secrets)"
            python collector.py --site --report
          fi

      - name: Проверить, что собралось
        run: |
          test -s data/index.html || { echo "витрина пустая"; exit 1; }
          python colorcheck.py data/index.html

      - name: Подготовить артефакт
        env:
          BILETDV_PARTNER_ID: ${{ secrets.BILETDV_PARTNER_ID }}
          SUBSIDY_SEARCH_API: ${{ vars.SUBSIDY_SEARCH_API }}
        run: |
          mkdir -p _site
          cp data/index.html _site/index.html
          # Макет нового дизайна живёт по адресу /design/: index.html собирается
          # design_app.py из тех же данных, что и основная витрина (та же БД,
          # тот же демо-баннер/noindex при отсутствии боевого PartnerID);
          # checkout.html статичный — данные рейса ему передают через адрес.
          # Обе страницы подключают общие токены из design/assets/ — без них
          # придут без стилей.
          if [ -d design ]; then
            mkdir -p _site/design
            python design_app.py --out _site/design/index.html
            test -s _site/design/index.html || { echo "design-витрина пустая"; exit 1; }
            cp design/checkout.html _site/design/checkout.html
            # Брендбук: доска фирменного стиля, открывается по /design/brandkit.html.
            cp design/brandkit.html _site/design/brandkit.html
            if [ -d design/assets ]; then cp -r design/assets _site/design/assets; fi
          fi
          # Альтернативные редакции: каждая собирается своим design_app.py из
          # ветки, но из той же базы наблюдений, что и основная витрина
          # (SUBSIDY_DB_PATH), и кладётся в /<имя>/.
          for v in variants/*/; do
            name=$(basename "$v")
            [ -f "$v/design_app.py" ] || continue
            mkdir -p "_site/$name"
            SUBSIDY_DB_PATH="$PWD/data/subsidy.sqlite3" SUBSIDY_DATA_DIR="$PWD/variants-data/$name" \
              python "$v/design_app.py" --out "_site/$name/index.html"
            test -s "_site/$name/index.html" || { echo "витрина $name пустая"; exit 1; }
            cp "$v/design/checkout.html" "_site/$name/checkout.html"
            cp -r "$v/design/assets" "_site/$name/assets"
          done
          # .nojekyll: без него Pages прогоняет содержимое через Jekyll
          # и молча выбрасывает файлы, начинающиеся с подчёркивания.
          touch _site/.nojekyll

      - name: Сохранить базу наблюдений
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: subsidy-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
